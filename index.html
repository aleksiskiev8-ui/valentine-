<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💛</title>
<style>
body {
  background: linear-gradient(#ffd6e8, #ffeef6);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}
.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  position: relative;
  width: 300px;
}
img {
  width: 220px;
  border-radius: 15px;
}
.buttons {
  margin-top: 20px;
}
button {
  padding: 10px 22px;
  font-size: 16px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
}
.yes {
  background: #ff4d6d;
  color: white;
}
.no {
  background: #ddd;
  position: absolute;
}
</style>
</head>
<body>

<div class="card">
  <img src="https://i.imgur.com/a/fX6kaCe.jpg"> alt="Minion">
  <h3>I have a little question for you… 💛</h3>
  <h2>Will you be my Valentine? 💖</h2>

  <div class="buttons">
    <button class="yes" onclick="alert('You just made my day 💕')">Yes 💖</button>
    <button class="no" id="noBtn">No 🙈</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("touchstart", () => {
  const x = Math.random() * 180 - 90;
  const y = Math.random() * 180 - 90;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
});
</script>

</body>
</html>
